<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('${company.name} - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('companies')}"></div>

<main>
    <section class="py-4 bg-light border-bottom">
        <div class="container">
            <a th:href="@{/companies}" class="text-decoration-none small">
                <i class="bi bi-arrow-left"></i> All Companies
            </a>
            <div class="d-flex align-items-center mt-3">
                <div class="rounded-circle d-flex align-items-center justify-content-center me-4"
                     style="width: 80px; height: 80px; background-color: #dbeafe;">
                    <i class="bi bi-building fs-1 text-brand"></i>
                </div>
                <div>
                    <h1 class="mb-1" th:text="${company.name}">Company</h1>
                    <p class="text-muted mb-0">
                        <span th:text="${company.industry}">Industry</span>
                        ·
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${company.location}">Location</span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="py-4">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card mb-4" th:if="${company.description != null}">
                        <div class="card-body">
                            <h5 class="mb-3">About the Company</h5>
                            <p style="white-space: pre-line;" th:text="${company.description}">...</p>
                        </div>
                    </div>

                    <h4 class="mb-3">Open Positions</h4>
                    <div th:if="${jobs.isEmpty()}" class="alert alert-info">
                        This company has no active job postings right now.
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6" th:each="job : ${jobs}">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h6 class="card-title" th:text="${job.title}">Job</h6>
                                    <p class="text-muted small mb-2">
                                        <i class="bi bi-geo-alt me-1"></i>
                                        <span th:text="${job.location}">Location</span>
                                    </p>
                                    <span class="badge bg-primary" th:text="${job.employmentType}">Type</span>
                                </div>
                                <div class="card-footer bg-transparent border-top-0">
                                    <a th:href="@{/jobs/{id}(id=${job.id})}"
                                       class="btn btn-sm btn-outline-primary w-100">View Job</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="mb-3">Contact</h5>
                            <p class="mb-2" th:if="${company.website != null}">
                                <i class="bi bi-globe me-2"></i>
                                <a th:href="${company.website}" target="_blank" th:text="${company.website}">Website</a>
                            </p>
                            <p class="mb-0">
                                <i class="bi bi-geo-alt me-2"></i>
                                <span th:text="${company.location}">Location</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
