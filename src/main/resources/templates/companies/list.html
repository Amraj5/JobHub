<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Companies - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('companies')}"></div>

<main>
    <section class="py-4 bg-light border-bottom">
        <div class="container">
            <h1 class="mb-1">Companies Hiring on JobHub</h1>
            <p class="text-muted mb-0">
                Browse <span th:text="${companies.size()}">0</span> companies and find your next role.
            </p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="c : ${companies}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
                                     style="width: 56px; height: 56px; background-color: #dbeafe;">
                                    <i class="bi bi-building fs-3 text-brand"></i>
                                </div>
                                <div>
                                    <h5 class="mb-0" th:text="${c.name}">Company</h5>
                                    <small class="text-muted" th:text="${c.industry}">Industry</small>
                                </div>
                            </div>
                            <p class="text-muted small mb-2">
                                <i class="bi bi-geo-alt me-1"></i>
                                <span th:text="${c.location}">Location</span>
                            </p>
                            <p class="card-text small"
                               th:if="${c.description != null}"
                               th:text="${#strings.abbreviate(c.description, 120)}">...</p>
                        </div>
                        <div class="card-footer bg-transparent border-top-0">
                            <a th:href="@{/companies/{id}(id=${c.id})}"
                               class="btn btn-outline-primary w-100">
                                View Company
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${companies.isEmpty()}" class="alert alert-info text-center py-4">
                No companies are registered yet.
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
