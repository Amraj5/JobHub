<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users - Admin')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-5">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">User Management</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.fullName}">Name</td>
                    <td th:text="${u.email}">Email</td>
                    <td th:text="${u.username}">Username</td>
                    <td><span class="badge bg-secondary" th:text="${u.role}">ROLE</span></td>
                    <td>
                        <span th:if="${u.active}" class="badge bg-success">Active</span>
                        <span th:unless="${u.active}" class="badge bg-danger">Inactive</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Toggle this user status?');">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'">
                                <span th:if="${u.active}">Deactivate</span>
                                <span th:unless="${u.active}">Activate</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
