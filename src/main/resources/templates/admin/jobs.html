<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Jobs - Admin')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-5">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Job Moderation</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="j : ${jobs}">
                    <td class="fw-semibold" th:text="${j.title}">Title</td>
                    <td th:text="${j.company.name}">Company</td>
                    <td th:text="${j.location}">Location</td>
                    <td><span class="badge bg-secondary" th:text="${j.status}">STATUS</span></td>
                    <td class="text-end">
                        <form th:action="@{/admin/jobs/{id}/delete(id=${j.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Permanently delete this job and its applications?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Remove
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
