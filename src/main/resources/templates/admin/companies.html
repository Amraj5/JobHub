<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Companies - Admin')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Companies</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Industry</th>
                    <th>Location</th>
                    <th>Owner</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${companies}">
                    <td class="fw-semibold" th:text="${c.name}">Name</td>
                    <td th:text="${c.industry}">Industry</td>
                    <td th:text="${c.location}">Location</td>
                    <td th:text="${c.owner.fullName}">Owner</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
