<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Applications - Admin')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">All Applications</h1>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Back</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Applicant</th>
                    <th>Job</th>
                    <th>Company</th>
                    <th>Applied</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${applications}">
                    <td th:text="${a.jobSeekerProfile.user.fullName}">Name</td>
                    <td th:text="${a.job.title}">Job</td>
                    <td th:text="${a.job.company.name}">Company</td>
                    <td th:text="${#temporals.format(a.appliedAt, 'MMM d, yyyy')}">Date</td>
                    <td><span class="badge bg-secondary" th:text="${a.status}">STATUS</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
