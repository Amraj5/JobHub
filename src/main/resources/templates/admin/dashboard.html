<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('admin')}"></div>

<main class="container my-5">

    <h1 class="mb-4">Admin Dashboard</h1>

    <div class="row g-3 mb-5">
        <div class="col-md-4 col-lg">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-people fs-1 text-primary"></i>
                    <h3 class="mt-2 mb-0" th:text="${totalUsers}">0</h3>
                    <p class="text-muted mb-0">Total Users</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-person-badge fs-1 text-info"></i>
                    <h3 class="mt-2 mb-0" th:text="${seekers}">0</h3>
                    <p class="text-muted mb-0">Seekers</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-building fs-1 text-success"></i>
                    <h3 class="mt-2 mb-0" th:text="${employers}">0</h3>
                    <p class="text-muted mb-0">Employers</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-briefcase fs-1 text-warning"></i>
                    <h3 class="mt-2 mb-0" th:text="${activeJobs}">0</h3>
                    <p class="text-muted mb-0">Active Jobs</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-file-earmark-text fs-1 text-purple"></i>
                    <h3 class="mt-2 mb-0" th:text="${totalApplications}">0</h3>
                    <p class="text-muted mb-0">Applications</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/users}" class="card text-decoration-none text-dark h-100">
                <div class="card-body text-center py-4">
                    <i class="bi bi-people fs-1 text-brand"></i>
                    <h5 class="mt-3 mb-0">Manage Users</h5>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/companies}" class="card text-decoration-none text-dark h-100">
                <div class="card-body text-center py-4">
                    <i class="bi bi-building fs-1 text-brand"></i>
                    <h5 class="mt-3 mb-0">Manage Companies</h5>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/jobs}" class="card text-decoration-none text-dark h-100">
                <div class="card-body text-center py-4">
                    <i class="bi bi-briefcase fs-1 text-brand"></i>
                    <h5 class="mt-3 mb-0">Manage Jobs</h5>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a th:href="@{/admin/applications}" class="card text-decoration-none text-dark h-100">
                <div class="card-body text-center py-4">
                    <i class="bi bi-file-earmark-text fs-1 text-brand"></i>
                    <h5 class="mt-3 mb-0">Applications</h5>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
