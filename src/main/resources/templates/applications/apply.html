<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Apply - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('jobs')}"></div>

<main class="container my-5" style="max-width: 720px;">

    <div class="mb-3">
        <a th:href="@{/jobs/{id}(id=${job.id})}" class="text-decoration-none small">
            <i class="bi bi-arrow-left"></i> Back to Job
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="mb-2">Apply for <span th:text="${job.title}">Job</span></h2>
            <p class="text-muted mb-4">
                at <span th:text="${job.company.name}">Company</span>
                —
                <span th:text="${job.location}">Location</span>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/seeker/apply/{id}(id=${job.id})}"
                  method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="cvFile" class="form-label">Upload CV (PDF only)</label>
                    <input type="file" id="cvFile" name="cvFile"
                           accept=".pdf,application/pdf"
                           class="form-control" required>
                    <div class="form-text">Maximum size: 5 MB. PDF format only.</div>
                </div>

                <div class="mb-3">
                    <label for="coverLetter" class="form-label">Cover Letter</label>
                    <textarea id="coverLetter" name="coverLetter"
                              rows="6" class="form-control"
                              placeholder="Tell the employer why you are a good fit..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i> Submit Application
                    </button>
                    <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
