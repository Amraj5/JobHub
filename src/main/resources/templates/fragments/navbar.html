<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-briefcase-fill text-info me-1">JobHub</i> 
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'jobs'} ? 'active'" th:href="@{/jobs}">Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'companies'} ? 'active'" th:href="@{/companies}">Companies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'about'} ? 'active'" th:href="@{/about}">About</a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                </li>
                <li class="nav-item ms-lg-2" th:if="${#authorization.expression('!isAuthenticated()')}">
                    <a class="btn btn-primary px-3" th:href="@{/register}">Register</a>
                </li>

                <li class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${#authentication.principal.user.fullName}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${#authorization.expression('hasRole(''JOB_SEEKER'')')}">
                            <a class="dropdown-item" th:href="@{/seeker/dashboard}">My Dashboard</a>
                        </li>
                        <li th:if="${#authorization.expression('hasRole(''EMPLOYER'')')}">
                            <a class="dropdown-item" th:href="@{/employer/dashboard}">My Dashboard</a>
                        </li>
                        <li th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                            <a class="dropdown-item" th:href="@{/admin/dashboard}">Admin Panel</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
