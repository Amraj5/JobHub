<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Applicants - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('employer')}"></div>

<main class="container my-5">

    <div th:replace="~{fragments/messages :: messages}"></div>

    <a th:href="@{/employer/jobs}" class="text-decoration-none small">
        <i class="bi bi-arrow-left"></i> Back to My Jobs
    </a>

    <h1 class="mt-2 mb-1" th:text="${job.title}">Job Title</h1>
    <p class="text-muted mb-4">
        <span th:text="${applications.size()}">0</span> applicants
    </p>

    <div th:if="${applications.isEmpty()}" class="alert alert-info">
        No applications yet for this job.
    </div>

    <div class="card" th:unless="${applications.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Applicant</th>
                    <th>Title</th>
                    <th>Experience</th>
                    <th>Applied</th>
                    <th>Status</th>
                    <th>Change Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td>
                        <div class="fw-semibold" th:text="${app.jobSeekerProfile.user.fullName}">Name</div>
                        <small class="text-muted" th:text="${app.jobSeekerProfile.user.email}">Email</small>
                    </td>
                    <td th:text="${app.jobSeekerProfile.title}">Title</td>
                    <td>
                        <span th:text="${app.jobSeekerProfile.yearsOfExperience ?: '—'}">Years</span>
                    </td>
                    <td th:text="${#temporals.format(app.appliedAt, 'MMM d, yyyy')}">Date</td>
                    <td>
                        <span class="badge"
                              th:classappend="${'bg-' + (app.status.name() == 'PENDING' ? 'warning text-dark'
                                              : app.status.name() == 'REVIEWING' ? 'info text-dark'
                                              : app.status.name() == 'SHORTLISTED' ? 'primary'
                                              : app.status.name() == 'INTERVIEW' ? 'purple'
                                              : app.status.name() == 'ACCEPTED' ? 'success'
                                              : 'danger')}"
                              th:text="${app.status}">STATUS</span>
                    </td>
                    <td>
                        <form th:action="@{/employer/applications/{id}/status(id=${app.id})}"
                              method="post" class="d-flex gap-1">
                            <select name="status" class="form-select form-select-sm">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s}"
                                        th:selected="${s == app.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Set</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
