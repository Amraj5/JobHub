<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Company Profile - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('employer')}"></div>

<main class="container my-5" style="max-width: 720px;">
    <h1 class="mb-4">Company Profile</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/employer/company}" th:object="${companyForm}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">Company Name</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="form-control"></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="website" class="form-label">Website</label>
                        <input type="text" id="website" th:field="*{website}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" id="location" th:field="*{location}" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="industry" class="form-label">Industry</label>
                    <select id="industry" th:field="*{industry}" class="form-select"
                            th:classappend="${#fields.hasErrors('industry')} ? 'is-invalid'">
                        <option value="">Choose...</option>
                        <option th:each="ind : ${T(com.job.jobapplication.model.Industry).values()}"
                                th:value="${ind}" th:text="${ind}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('industry')}"
                         th:errors="*{industry}"></div>
                </div>

                <div class="mb-3">
                    <label for="logoUrl" class="form-label">Logo URL (optional)</label>
                    <input type="text" id="logoUrl" th:field="*{logoUrl}" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">
                    <span th:if="${company == null}">Create Company</span>
                    <span th:if="${company != null}">Save Changes</span>
                </button>
                <a th:href="@{/employer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
