<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('${jobId == null ? ''Post'' : ''Edit''} Job - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('employer')}"></div>

<main class="container my-5" style="max-width: 800px;">

    <div th:replace="~{fragments/messages :: messages}"></div>

    <h1 class="mb-4">
        <span th:if="${jobId == null}">Post a Job</span>
        <span th:if="${jobId != null}">Edit Job</span>
    </h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="${jobId == null ? '/employer/jobs/new' : '/employer/jobs/' + jobId + '/edit'}"
                  th:object="${jobForm}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">Job Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="requirements" class="form-label">Requirements</label>
                    <textarea id="requirements" th:field="*{requirements}" rows="4"
                              class="form-control"></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" th:field="*{category}" class="form-select">
                            <option value="">Choose...</option>
                            <option th:each="c : ${T(com.job.jobapplication.model.Industry).values()}"
                                    th:value="${c}" th:text="${c}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" id="location" th:field="*{location}" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="employmentType" class="form-label">Employment Type</label>
                        <select id="employmentType" th:field="*{employmentType}" class="form-select">
                            <option value="">Choose...</option>
                            <option th:each="t : ${T(com.job.jobapplication.model.EmploymentType).values()}"
                                    th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="experienceLevel" class="form-label">Experience Level</label>
                        <select id="experienceLevel" th:field="*{experienceLevel}" class="form-select">
                            <option value="">Choose...</option>
                            <option th:each="l : ${T(com.job.jobapplication.model.ExperienceLevel).values()}"
                                    th:value="${l}" th:text="${l}"></option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label for="salaryMin" class="form-label">Salary Min</label>
                        <input type="number" id="salaryMin" th:field="*{salaryMin}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="salaryMax" class="form-label">Salary Max</label>
                        <input type="number" id="salaryMax" th:field="*{salaryMax}" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label for="currency" class="form-label">Currency</label>
                        <input type="text" id="currency" th:field="*{currency}"
                               class="form-control" maxlength="3" placeholder="NGN">
                    </div>
                    <div class="col-md-3">
                        <label for="deadline" class="form-label">Deadline</label>
                        <input type="date" id="deadline" th:field="*{deadline}" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span th:if="${jobId == null}">Post Job</span>
                    <span th:if="${jobId != null}">Save Changes</span>
                </button>
                <a th:href="@{/employer/jobs}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
