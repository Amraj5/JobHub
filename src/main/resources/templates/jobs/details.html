<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('${job.title} - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('jobs')}"></div>

<main>
    <section class="py-4 bg-light border-bottom">
        <div class="container">
            <a th:href="@{/jobs}" class="text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Back to Jobs
            </a>
            <div class="d-flex justify-content-between align-items-start mt-2">
                <div>
                    <h1 th:text="${job.title}" class="mb-2">Job Title</h1>
                    <p class="text-muted mb-1">
                        <i class="bi bi-building me-1"></i>
                        <span th:text="${job.company.name}">Company</span>
                    </p>
                    <p class="text-muted mb-0">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${job.location}">Location</span>
                    </p>
                </div>
                <div class="text-end">
                    <div class="mb-2">
                        <span class="badge bg-primary" th:text="${job.employmentType}">Type</span>
                        <span class="badge bg-secondary" th:text="${job.experienceLevel}">Level</span>
                    </div>
                    <p class="fw-bold text-success fs-4 mb-0" th:if="${job.salaryMin != null}">
                        <span th:text="${job.currency}">NGN</span>
                        <span th:text="${#numbers.formatInteger(job.salaryMin, 3, 'COMMA')}">0</span>
                        <span th:if="${job.salaryMax != null}"> - </span>
                        <span th:if="${job.salaryMax != null}"
                              th:text="${#numbers.formatInteger(job.salaryMax, 3, 'COMMA')}">0</span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="py-4">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h4 class="mb-3">Description</h4>
                            <p style="white-space: pre-line;" th:text="${job.description}">...</p>
                        </div>
                    </div>

                    <div class="card mb-4" th:if="${job.requirements != null}">
                        <div class="card-body">
                            <h4 class="mb-3">Requirements</h4>
                            <p style="white-space: pre-line;" th:text="${job.requirements}">...</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="mb-3">Job Overview</h5>
                            <dl class="row mb-0 small">
                                <dt class="col-5">Category</dt>
                                <dd class="col-7" th:text="${job.category}">-</dd>

                                <dt class="col-5">Location</dt>
                                <dd class="col-7" th:text="${job.location}">-</dd>

                                <dt class="col-5">Deadline</dt>
                                <dd class="col-7" th:text="${job.deadline}">-</dd>

                                <dt class="col-5">Posted</dt>
                                <dd class="col-7" th:text="${#temporals.format(job.createdAt, 'MMM d, yyyy')}">-</dd>
                            </dl>
                        </div>
                    </div>

                    <div class="d-grid">
                        <a th:if="${#authorization.expression('hasRole(''JOB_SEEKER'')')}"
                           th:if-not="${alreadyApplied}"
                           th:href="@{/seeker/apply/{id}(id=${job.id})}"
                           class="btn btn-primary btn-lg">
                            <i class="bi bi-send me-1"></i> Apply Now
                        </a>

                        <button th:if="${alreadyApplied}" class="btn btn-secondary btn-lg" disabled>
                            <i class="bi bi-check2 me-1"></i> Already Applied
                        </button>

                        <a th:if="${#authorization.expression('!isAuthenticated()')}"
                           th:href="@{/login}"
                           class="btn btn-primary btn-lg">
                            Log in to Apply
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
