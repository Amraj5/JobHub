<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('seeker')}"></div>

<main class="container my-5">

    <div th:replace="~{fragments/messages :: messages}"></div>

    <h1 class="mb-1">Welcome back, <span th:text="${user.fullName}">User</span></h1>
    <p class="text-muted mb-4">Here is your job search snapshot.</p>

    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-send fs-1 text-primary"></i>
                    <h3 class="mt-2 mb-0" th:text="${appliedCount}">0</h3>
                    <p class="text-muted mb-0">Applied Jobs</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-star fs-1 text-info"></i>
                    <h3 class="mt-2 mb-0" th:text="${shortlistedCount}">0</h3>
                    <p class="text-muted mb-0">Shortlisted</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-check fs-1 text-purple"></i>
                    <h3 class="mt-2 mb-0" th:text="${interviewCount}">0</h3>
                    <p class="text-muted mb-0">Interviews</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Recent Applications</h4>
                <a th:href="@{/seeker/applications}" class="btn btn-sm btn-outline-primary">View All</a>
            </div>

            <div th:if="${recentApplications.isEmpty()}" class="alert alert-info">
                You haven't applied to any jobs yet. <a th:href="@{/jobs}">Browse jobs</a>
            </div>

            <div class="card" th:unless="${recentApplications.isEmpty()}">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="app : ${recentApplications}">
                        <div>
                            <div class="fw-semibold" th:text="${app.job.title}">Job</div>
                            <small class="text-muted" th:text="${app.job.company.name}">Company</small>
                        </div>
                        <span class="badge"
                              th:classappend="${'bg-' + (app.status.name() == 'PENDING' ? 'warning text-dark'
                                              : app.status.name() == 'REVIEWING' ? 'info text-dark'
                                              : app.status.name() == 'SHORTLISTED' ? 'primary'
                                              : app.status.name() == 'INTERVIEW' ? 'purple'
                                              : app.status.name() == 'ACCEPTED' ? 'success'
                                              : 'danger')}"
                              th:text="${app.status}">PENDING</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-lg-5">
            <h4 class="mb-3">Recommended Jobs</h4>
            <div class="card mb-2" th:each="job : ${recommended}">
                <div class="card-body py-3">
                    <h6 class="mb-1" th:text="${job.title}">Job</h6>
                    <small class="text-muted d-block" th:text="${job.company.name}">Company</small>
                    <small class="text-muted d-block mb-2" th:text="${job.location}">Location</small>
                    <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-sm btn-outline-primary">View</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
