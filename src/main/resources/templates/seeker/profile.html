<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile - JobHub')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar('seeker')}"></div>

<main class="container my-5">

    <h1 class="mb-4">My Profile</h1>

    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card text-center">
                <div class="card-body">
                    <div class="mb-3">
                        <i class="bi bi-person-circle" style="font-size: 6rem; color: #1e40af;"></i>
                    </div>
                    <h4 th:text="${user.fullName}">Name</h4>
                    <p class="text-muted mb-1" th:text="${profile.title}">Title</p>
                    <p class="text-muted small mb-0" th:text="${user.email}">Email</p>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Resume / CV</h5>

                    <div th:if="${profile.cvUrl != null}" class="mb-3">
                        <i class="bi bi-file-earmark-pdf text-danger me-1"></i>
                        <a th:href="${profile.cvUrl}" target="_blank">View current CV</a>
                    </div>
                    <div th:unless="${profile.cvUrl != null}" class="text-muted mb-3">
                        No CV uploaded yet.
                    </div>

                    <form th:action="@{/seeker/profile/cv}" method="post" enctype="multipart/form-data">
                        <div class="mb-2">
                            <input type="file" name="cvFile" accept=".pdf,application/pdf"
                                   class="form-control form-control-sm" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            <i class="bi bi-upload me-1"></i> Upload CV
                        </button>
                    </form>
                    <div class="form-text mt-2">PDF only. Max 5 MB.</div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Professional Info</h5>
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Title</dt>
                        <dd class="col-sm-8" th:text="${profile.title}">-</dd>

                        <dt class="col-sm-4">Location</dt>
                        <dd class="col-sm-8" th:text="${profile.location}">-</dd>

                        <dt class="col-sm-4">Years of Experience</dt>
                        <dd class="col-sm-8" th:text="${profile.yearsOfExperience ?: 'Not set'}">-</dd>

                        <dt class="col-sm-4">Phone</dt>
                        <dd class="col-sm-8" th:text="${user.phone ?: 'Not set'}">-</dd>
                    </dl>
                </div>
            </div>

            <div class="card mb-4" th:if="${profile.bio != null}">
                <div class="card-body">
                    <h5 class="mb-3">About</h5>
                    <p class="mb-0" th:text="${profile.bio}">...</p>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Skills</h5>
                    <div th:if="${profile.skills.isEmpty()}" class="text-muted">No skills added yet.</div>
                    <span class="badge bg-primary me-1 mb-1" th:each="skill : ${profile.skills}"
                          th:text="${skill.name}">Skill</span>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="mb-3">Education</h5>
                    <div th:if="${profile.education.isEmpty()}" class="text-muted">No education records yet.</div>
                    <ul class="list-unstyled mb-0">
                        <li class="mb-3" th:each="edu : ${profile.education}">
                            <div class="fw-semibold" th:text="${edu.qualification}">Degree</div>
                            <div class="text-muted small" th:text="${edu.institution}">Institution</div>
                            <div class="text-muted small">
                                <span th:text="${edu.startYear}">2015</span> -
                                <span th:text="${edu.endYear}">2019</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
